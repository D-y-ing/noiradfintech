
services:
  - type: web
    name: agentic-ad-broker-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npx tsx apps/server/src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_CONTROLS
        value: "false"
      - key: ENABLE_DEMO_PAYMENTS
        value: "false"
      - key: PUBLIC_API_URL
        value: https://agentic-ad-broker-api.onrender.com
      - key: FRONTEND_URL
        value: https://agentic-ad-broker.onrender.com
      - key: DEVICE_HASH
        sync: false
      - key: AGENT_SECRET
        sync: false
      - key: CREATOR_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini

  - type: web
    name: agentic-ad-broker
    runtime: static
    region: singapore
    buildCommand: npm ci --include=dev && npm run build --workspace=@agentic-ad-broker/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://agentic-ad-broker-api.onrender.com
